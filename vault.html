<style>
  :root {
    --bg: #121213; --panel: #1e1e20; --green: #538d4e;
    --yellow: #b59f3b; --grey: #27272a; --text: #ffffff;
    --accent: #38bdf8; --gold: #facc15; --danger: #ef4444;
  }
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 14px; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .nav-tabs {
    display: flex; gap: 6px; width: 100%; max-width: 440px; margin-bottom: 12px;
    background: var(--panel); padding: 6px; border-radius: 10px;
  }
  .nav-tabs a {
    flex: 1; text-align: center; padding: 8px 0; border-radius: 6px;
    color: #e4e4e7; text-decoration: none; font-weight: 700; font-size: 0.92rem;
  }
  .nav-tabs a.active { background: #2e2e32; color: var(--accent); }
  header {
    width: 100%; max-width: 440px; display: flex; justify-content: space-between;
    align-items: center; border-bottom: 1px solid #2e2e30; padding-bottom: 10px; margin-bottom: 12px;
  }
  .title-wrap { display: flex; flex-direction: column; }
  h1 { font-size: 1.2rem; letter-spacing: 2px; margin: 0; }
  .bank-score { font-size: 0.82rem; color: var(--gold); font-weight: 700; margin-top: 2px; }
  select, button {
    background: var(--panel); color: var(--text); border: 1px solid #3a3a3c;
    border-radius: 6px; padding: 6px 10px; font-size: 0.9rem; cursor: pointer;
  }
  /* Stadium Scoreboard */
  .scoreboard {
    width: 100%; max-width: 440px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin-bottom: 12px;
  }
  .stat-card {
    background: var(--panel); border: 2px solid #2e2e32;
    border-radius: 10px; padding: 10px 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .stat-card.alarm-safe { border-color: var(--green); background: rgba(83, 141, 78, 0.12); }
  .stat-card.alarm-safe .stat-val { color: #6ee7b7; }
  .stat-card.alarm-warn { border-color: #f97316; background: rgba(249, 115, 22, 0.14); }
  .stat-card.alarm-warn .stat-val { color: #fb923c; }
  .stat-card.alarm-crit { border-color: var(--danger); background: rgba(239, 68, 68, 0.18); }
  .stat-card.alarm-crit .stat-val { color: #f87171; }
  .stat-card.pts-card { border-color: rgba(250, 204, 21, 0.45); }
  .stat-label {
    font-size: 0.76rem; font-weight: 800; letter-spacing: 0.8px;
    color: #e4e4e7; text-transform: uppercase; margin-bottom: 4px;
  }
  .stat-val { font-size: 1.65rem; font-weight: 900; line-height: 1; }
  .pts-high { color: var(--gold); }
  .pts-mid { color: var(--accent); }
  .pts-low { color: #f87171; }

  .sub-rule {
    width: 100%; max-width: 440px; background: var(--panel); padding: 10px 14px;
    border-radius: 8px; font-size: 0.95rem; color: #f4f4f5; line-height: 1.5;
    border: 1px solid #3f3f46; margin-bottom: 12px; text-align: center;
  }
  .ladder { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .rung {
    background: var(--panel); border: 2px solid #2e2e30; border-radius: 10px;
    padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .rung.active { border-color: var(--accent); background: #232329; }
  .rung.solved { border-color: var(--green); cursor: default; }
  .rung.failed-reveal { border-color: var(--danger); background: rgba(239, 68, 68, 0.12); cursor: default; }

  /* Red Shake Animation for Wrong Answer */
  @keyframes alarmShake {
    0%, 100% { transform: translateX(0); }
    15%, 45%, 75% { transform: translateX(-10px); }
    30%, 60%, 90% { transform: translateX(10px); }
  }
  .rung.wrong-shake {
    border-color: var(--danger) !important;
    background: rgba(239, 68, 68, 0.28) !important;
    animation: alarmShake 0.45s ease-in-out;
  }
  .rung.wrong-shake .tile {
    background: var(--danger) !important;
    border-color: #fca5a5 !important;
    color: #ffffff !important;
  }


  @keyframes tilePopWave {
    0% { transform: scale(1) translateY(0); }
    40% { transform: scale(1.18) translateY(-10px); background: #22c55e; border-color: #facc15; box-shadow: 0 8px 18px rgba(34, 197, 94, 0.55); }
    75% { transform: scale(0.96) translateY(2px); }
    100% { transform: scale(1) translateY(0); }
  }
  @keyframes rungGlowPulse {
    0% { box-shadow: 0 0 0 rgba(83, 141, 78, 0); border-color: #facc15; }
    45% { box-shadow: 0 0 26px rgba(34, 197, 94, 0.75); border-color: #facc15; background: rgba(34, 197, 94, 0.22); }
    100% { box-shadow: 0 0 0 rgba(83, 141, 78, 0); border-color: var(--green); }
  }
  .rung.just-solved {
    animation: rungGlowPulse 0.85s ease-out;
  }
  .rung.just-solved .tile {
    animation: tilePopWave 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .rung.just-solved .tile:nth-child(1) { animation-delay: 0.00s; }
  .rung.just-solved .tile:nth-child(2) { animation-delay: 0.07s; }
  .rung.just-solved .tile:nth-child(3) { animation-delay: 0.14s; }
  .rung.just-solved .tile:nth-child(4) { animation-delay: 0.21s; }
  .rung.just-solved .tile:nth-child(5) { animation-delay: 0.28s; }

  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(85vh) rotate(720deg); opacity: 0; }
  }
  .confetti-piece {
    position: fixed; top: 0; width: 10px; height: 14px;
    border-radius: 2px; pointer-events: none; z-index: 999;
    animation: confettiFall 1.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  .rung-header {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 1.02rem; font-weight: 700; color: #ffffff;
  }
  .rung-badge { font-size: 0.8rem; font-weight: 800; padding: 3px 7px; border-radius: 4px; background: #3f3f46; color: var(--accent); }
  .tiles { display: flex; gap: 8px; justify-content: center; }
  .tile {
    width: 52px; height: 52px; border: 2px solid #3f3f46; border-radius: 6px;
    display: flex; align-items: center; justify-content: center; font-size: 1.55rem; font-weight: 800; background: #18181b;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .rung.solved .tile { background: var(--green); border-color: var(--green); }
  .rung.failed-reveal .tile { background: #7f1d1d; border-color: var(--danger); }

  .keyboard { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 6px; }
  .kb-row { display: flex; justify-content: center; gap: 5px; }
  .key {
    flex: 1; height: 48px; max-width: 40px; background: #52525b; color: #fff;
    border: none; border-radius: 6px; font-weight: 700; font-size: 1.05rem; cursor: pointer;
  }
  .key.wide { max-width: 66px; font-size: 0.85rem; }
  .key.neighbor-hint { background: var(--yellow); color: #fff; }
  .modal {
    display: none; flex-direction: column; align-items: center; background: var(--panel);
    border: 2px solid var(--gold); padding: 18px; border-radius: 12px; width: 100%; max-width: 440px;
    text-align: center; margin-bottom: 14px;
  }
  .modal.active { display: flex; }
  .modal.locked-out { border-color: var(--danger); }
  .modal-btns { display: flex; gap: 10px; margin-top: 12px; }
  .share-btn { background: var(--green); border: none; font-weight: 700; padding: 10px 16px; color:#fff; }
  .next-btn { background: var(--accent); border: none; font-weight: 700; padding: 10px 16px; color:#000; }

let currentVault = null, solved = [], inputs = [], activeRung = 1, solveOrder = [], mistakes = 0, isFinished = false, isLockedOut = false;
let wrongRungIdx = null, justSolvedRungIdx = null, inputFrozen = false;

function launchConfetti() {
  const colors = ['#facc15', '#22c55e', '#38bdf8', '#f472b6', '#ffffff'];
  for (let i = 0; i < 55; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (1.2 + Math.random() * 1.1) + 's';
    el.style.animationDelay = (Math.random() * 0.25) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }
}
const badgeEl = document.getElementById("levelBadge");
const STATE_KEY = "the_vault_oneshot_state_v1";

function getAllState() {
  try { return JSON.parse(localStorage.getItem(STATE_KEY)) || {}; }
  catch (e) { return {}; }
}

function saveVaultState() {
  const all = getAllState();
  all[currentVault.id] = {
    solved, inputs, activeRung, solveOrder, mistakes, isFinished, isLockedOut,
    pts: calcPoints(mistakes, isLockedOut)
  };
  localStorage.setItem(STATE_KEY, JSON.stringify(all));
}

function calcPoints(m, locked) {
  if (locked || m > 2) return 0;
  if (m === 0) return 100;
  if (m === 1) return 70;
  return 40;
}

function updateHeaderBank() {
  const all = getAllState();
  const done = Object.values(all).filter(s => s.isFinished);
  const total = done.reduce((acc, s) => acc + s.pts, 0);
  document.getElementById("totalScoreDisplay").textContent = `🏆 Total Score: ${total} pts (${done.length}/${VAULTS.length} played)`;
}

function getHighestUnlockedIdx() {
  const all = getAllState();
  for (let i = 0; i < VAULTS.length; i++) {
    const s = all[VAULTS[i].id];
    if (!s || !s.isFinished) return i;
  }
  return VAULTS.length - 1;
}

function initDropdown() {
  const el = document.getElementById("levelBadge");
  if (el && typeof currentPuzzle !== "undefined" && currentPuzzle) el.textContent = `VAULT #${currentPuzzle.id}`;
  if (el && typeof currentVault !== "undefined" && currentVault) el.textContent = `VAULT #${currentVault.id}`;
}
function loadVault(idx) {
  currentVault = VAULTS[idx];
  const bEl = document.getElementById('levelBadge'); if (bEl) bEl.textContent = 'VAULT #' + currentVault.id;
  if (document.getElementById('levelBadge')) document.getElementById('levelBadge').textContent = `VAULT #${currentVault.id}`;
  const saved = getAllState()[currentVault.id];
  wrongRungIdx = null;
  justSolvedRungIdx = null;
  inputFrozen = false;
  if (saved) {
    solved = [...saved.solved];
    inputs = [...saved.inputs];
    activeRung = saved.activeRung;
    solveOrder = [...saved.solveOrder];
    mistakes = saved.mistakes || 0;
    isFinished = saved.isFinished || false;
    isLockedOut = saved.isLockedOut || false;
  } else {
    solved = [true, false, false, false, false];
    inputs = [currentVault.rungs[0].word, "", "", "", ""];
    activeRung = 1;
    solveOrder = [1];
    mistakes = 0;
    isFinished = false;
    isLockedOut = false;
  }
  updateHeaderBank();
  render();
}

function goNextVault() {
  loadVault(getHighestUnlockedIdx());
}

function selectRung(idx) {
  if (isFinished || inputFrozen || solved[idx]) return;
  activeRung = idx;
  render();
}

function onKey(k) {
  if (isFinished || inputFrozen) return;
  let cur = inputs[activeRung];
  if (k === "BACK") inputs[activeRung] = cur.slice(0, -1);
  else if (k === "ENTER") { checkRung(); return; }
  else if (/^[A-Z]$/.test(k) && cur.length < 5) inputs[activeRung] += k;
  render();
}

function checkRung() {
  const guess = inputs[activeRung];
  if (guess.length < 5) return;
  const target = currentVault.rungs[activeRung].word;

  if (guess === target) {
    const crackedIdx = activeRung;
    solved[crackedIdx] = true;
    justSolvedRungIdx = crackedIdx;
    solveOrder.push(crackedIdx + 1);
    const nextUnsolved = solved.findIndex(s => !s);
    if (nextUnsolved !== -1) {
      activeRung = nextUnsolved;
    } else {
      isFinished = true;
      launchConfetti();
    }
    saveVaultState();
    initDropdown();
    updateHeaderBank();
    render();
    setTimeout(() => {
      if (justSolvedRungIdx === crackedIdx) {
        justSolvedRungIdx = null;
        render();
      }
    }, 950);
  } else {
    // WRONG ANSWER: Trigger Red Shake + Alarm + 2-Second Wipe!
    mistakes++;
    wrongRungIdx = activeRung;
    inputFrozen = true;
    if (mistakes > 2) {
      isLockedOut = true;
      isFinished = true;
    }
    saveVaultState();
    initDropdown();
    updateHeaderBank();
    render();

    setTimeout(() => {
      if (!isLockedOut) {
        inputs[wrongRungIdx] = "";
      }
      wrongRungIdx = null;
      inputFrozen = false;
      saveVaultState();
      render();
    }, 2000);
  }
}

function render() {
  // Update Scoreboard
  const crackedCount = solved.filter(Boolean).length;
  document.getElementById("crackedVal").textContent = `${crackedCount}/5`;
  document.getElementById("mistakesVal").textContent = `${Math.min(mistakes, 3)}/2`;

  const alarmCard = document.getElementById("alarmCard");
  if (mistakes === 0) alarmCard.className = "stat-card alarm-safe";
  else if (mistakes === 1) alarmCard.className = "stat-card alarm-warn";
  else alarmCard.className = "stat-card alarm-crit";

  const pts = calcPoints(mistakes, isLockedOut);
  const scoreEl = document.getElementById("scoreVal");
  scoreEl.textContent = pts;
  scoreEl.className = "stat-val " + (pts === 100 ? "pts-high" : pts >= 40 ? "pts-mid" : "pts-low");

  // Render Ladder
  const ladderEl = document.getElementById("ladder");
  ladderEl.innerHTML = "";
  currentVault.rungs.forEach((r, idx) => {
    const div = document.createElement("div");
    let cls = "rung";
    if (idx === wrongRungIdx) cls += " wrong-shake";
    else if (solved[idx]) cls += " solved" + (idx === justSolvedRungIdx ? " just-solved" : "");
    else if (isLockedOut) cls += " failed-reveal";
    else if (idx === activeRung) cls += " active";
    div.className = cls;
    div.onclick = () => selectRung(idx);

    let badgeTxt = solved[idx] ? (idx === justSolvedRungIdx ? "✨ CRACKED!" : "UNLOCKED") : (idx === wrongRungIdx ? "🚨 WRONG — WIPING..." : (isLockedOut ? "LOCKED OUT" : "TAP TO SOLVE"));
    div.innerHTML = `<div class="rung-header"><span>${r.clue}</span><span class="rung-badge">${badgeTxt}</span></div>`;

    const tilesDiv = document.createElement("div");
    tilesDiv.className = "tiles";
    const str = (solved[idx] || isLockedOut) ? r.word : inputs[idx];
    for (let i = 0; i < 5; i++) {
      const t = document.createElement("div");
      t.className = "tile";
      t.textContent = str[i] || "";
      tilesDiv.appendChild(t);
    }
    div.appendChild(tilesDiv);
    ladderEl.appendChild(div);
  });

  // Modal check
  const modal = document.getElementById("winModal");
  if (isFinished && !inputFrozen) {
    modal.className = "modal active" + (isLockedOut ? " locked-out" : "");
    const emojis = ["1️⃣","2️⃣","3️⃣","4️⃣","5️⃣"];
    const path = solveOrder.map(n => emojis[n-1]).join(" ➔ ");
    if (isLockedOut) {
      document.getElementById("modalTitle").textContent = "🚨 VAULT LOCKED DOWN (0 PTS)";
      document.getElementById("modalSub").textContent = "3 Alarms Tripped — Security Lockdown!";
      document.getElementById("modalPath").textContent = `Cracked before lockout: ${path}`;
    } else {
      document.getElementById("modalTitle").textContent = `🔓 ${pts} POINTS LOCKED!`;
      document.getElementById("modalSub").textContent = mistakes === 0 ? "Flawless Heist (0 Mistakes!)" : `Cracked with ${mistakes}/2 Alarms Tripped`;
      document.getElementById("modalPath").textContent = `Solve Order: ${path}`;
    }
  } else {
    modal.className = "modal";
  }

  // Render Keyboard
  const neighborLetters = new Set();
  if (!isFinished) {
    if (activeRung > 0 && solved[activeRung - 1]) currentVault.rungs[activeRung - 1].word.split("").forEach(c => neighborLetters.add(c));
    if (activeRung < 4 && solved[activeRung + 1]) currentVault.rungs[activeRung + 1].word.split("").forEach(c => neighborLetters.add(c));
  }
  const kbEl = document.getElementById("keyboard");
  kbEl.innerHTML = "";
  [
    ["Q","W","E","R","T","Y","U","I","O","P"],
    ["A","S","D","F","G","H","J","K","L"],
    ["ENTER","Z","X","C","V","B","N","M","BACK"]
  ].forEach(r => {
    const rDiv = document.createElement("div"); rDiv.className = "kb-row";
    r.forEach(k => {
      const btn = document.createElement("button");
      btn.className = "key" + (k.length > 1 ? " wide" : "") + (neighborLetters.has(k) ? " neighbor-hint" : "");
      btn.textContent = k === "BACK" ? "⌫" : k;
      btn.onclick = () => onKey(k);
      rDiv.appendChild(btn);
    });
    kbEl.appendChild(rDiv);
  });
}

window.addEventListener("keydown", e => {
  if (e.key === "Backspace") onKey("BACK");
  else if (e.key === "Enter") onKey("ENTER");
  else if (/^[a-zA-Z]$/.test(e.key)) onKey(e.key.toUpperCase());
});

function shareResult() {
  const emojis = ["1️⃣","2️⃣","3️⃣","4️⃣","5️⃣"];
  const path = solveOrder.map(n => emojis[n-1]).join(" ➔ ");
  const pts = calcPoints(mistakes, isLockedOut);
  const status = isLockedOut ? "🚨 LOCKED OUT (0 PTS)" : `🔓 ${pts} PTS (${mistakes}/2 Alarms)`;
  const text = `THE VAULT #${currentVault.id} — ${status}\nSolve Order: ${path}`;
  navigator.clipboard.writeText(text);
  alert("Copied to clipboard!\n\n" + text);
}

initDropdown();
if (VAULTS.length) { loadVault(getHighestUnlockedIdx()); }
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('installAppBtn');
  if (btn) btn.style.display = 'inline-block';
});
function triggerInstall() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      const btn = document.getElementById('installAppBtn');
      if (btn) btn.style.display = 'none';
    });
  }
}
</script>
