<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BRIDGE — Daily Lab</title>
<style>
  :root {
    --bg: #1e293b; --panel: #1e293b; --green: #22c55e;
    --yellow: #eab308; --grey: #475569; --text: #ffffff;
    --accent: #38bdf8; --gold: #facc15; --danger: #ef4444;
  }
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 14px; color: var(--text);
    background: radial-gradient(circle at 50% 18%, #3b4c66 0%, #1e293b 55%, #0f172a 100%);
    background-attachment: fixed;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .nav-tabs {
    display: flex; gap: 6px; width: 100%; max-width: 440px; margin-bottom: 12px;
    background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(8px);
    padding: 6px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 6px 16px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .nav-tabs a {
    flex: 1; text-align: center; padding: 8px 0; border-radius: 6px;
    color: #e4e4e7; text-decoration: none; font-weight: 700; font-size: 0.92rem;
  }
  .nav-tabs a.active {
    background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
    color: #ffffff;
    box-shadow: 0 3px 0 #0369a1, 0 4px 10px rgba(0,0,0,0.3);
  }
  header {
    width: 100%; max-width: 440px; display: flex; justify-content: space-between;
    align-items: center; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 10px; margin-bottom: 12px;
  }
  .title-wrap { display: flex; flex-direction: column; }
  h1 { font-size: 1.25rem; letter-spacing: 2px; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }
  .bank-score { font-size: 0.85rem; color: var(--gold); font-weight: 800; margin-top: 2px; }
  select, button {
    background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
    color: var(--text); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; padding: 7px 12px; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; box-shadow: 0 4px 0 #0f172a;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #0f172a; }

  /* 3D Stadium Scoreboard */
  .scoreboard {
    width: 100%; max-width: 440px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    margin-bottom: 14px;
  }
  .stat-card {
    background: linear-gradient(180deg, rgba(45, 58, 79, 0.92) 0%, rgba(30, 41, 59, 0.95) 100%);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 6px 0 #0f172a, 0 10px 20px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.18);
    border-radius: 10px; padding: 10px 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .stat-card.turn-green { border-color: #4ade80 !important; }
  .stat-card.turn-green .stat-val { color: #4ade80; }
  .stat-card.turn-orange { border-color: #fb923c !important; }
  .stat-card.turn-orange .stat-val { color: #fb923c; }
  .stat-card.turn-red { border-color: #f87171 !important; }
  .stat-card.turn-red .stat-val { color: #f87171; }
  .stat-label {
    font-size: 0.76rem; font-weight: 800; letter-spacing: 0.8px;
    color: #e4e4e7; text-transform: uppercase; margin-bottom: 4px;
  }
  .stat-val { font-size: 1.65rem; font-weight: 900; line-height: 1; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }
  .pts-high { color: var(--gold); }
  .pts-mid { color: var(--accent); }
  .pts-low { color: #f87171; }

  .clues-box {
    width: 100%; max-width: 440px;
    background: linear-gradient(180deg, rgba(45, 58, 79, 0.92) 0%, rgba(30, 41, 59, 0.95) 100%);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 6px 0 #0f172a, 0 10px 20px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.18);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .clue-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 12px; background: rgba(15, 23, 42, 0.65);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; font-weight: 800; font-size: 1.08rem; color: #ffffff;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
  }
  .clue-row.locked { color: #94a3b8; font-weight: 600; font-style: italic; font-size: 0.95rem; }
  .clue-badge {
    font-size: 0.78rem; font-weight: 800; background: #334155; color: var(--accent);
    padding: 3px 8px; border-radius: 5px; border: 1px solid rgba(56,189,248,0.3);
  }

  .grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; }
  .cell {
    width: 58px; height: 58px;
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
    box-shadow: 0 6px 0 #090d16, 0 8px 14px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.65rem; font-weight: 900; text-shadow: 0 2px 3px rgba(0,0,0,0.45);
  }
  .cell.active-input { border: 2px solid var(--accent); background: linear-gradient(180deg, #28374d 0%, #162032 100%); }
  .cell.locked-hint {
    color: rgba(255,255,255,0.65); border: 2px solid #4ade80;
    background: linear-gradient(180deg, rgba(34, 197, 94, 0.28) 0%, rgba(21, 128, 61, 0.28) 100%);
  }
  .cell.green {
    background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
    border-color: #4ade80;
    box-shadow: 0 6px 0 #14532d, 0 8px 15px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .cell.yellow {
    background: linear-gradient(180deg, #eab308 0%, #b45309 100%);
    border-color: #fde047;
    box-shadow: 0 6px 0 #78350f, 0 8px 15px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .cell.grey {
    background: linear-gradient(180deg, #475569 0%, #334155 100%);
    border-color: #64748b;
    box-shadow: 0 6px 0 #1e293b, 0 8px 15px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
  }

  /* 3D Animations: Win Bounce & Miss Shake */
  @keyframes winWave {
    0% { transform: scale(1) translateY(0); }
    40% { transform: scale(1.16) translateY(-10px); border-color: var(--gold); box-shadow: 0 12px 20px rgba(34, 197, 94, 0.55); }
    100% { transform: scale(1) translateY(0); }
  }
  .row.win-row .cell { animation: winWave 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .row.win-row .cell:nth-child(1) { animation-delay: 0.00s; }
  .row.win-row .cell:nth-child(2) { animation-delay: 0.07s; }
  .row.win-row .cell:nth-child(3) { animation-delay: 0.14s; }
  .row.win-row .cell:nth-child(4) { animation-delay: 0.21s; }
  .row.win-row .cell:nth-child(5) { animation-delay: 0.28s; }

  @keyframes missShake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }
  .row.shake-row { animation: missShake 0.4s ease-in-out; }

  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(85vh) rotate(720deg); opacity: 0; }
  }
  .confetti-piece {
    position: fixed; top: 0; width: 10px; height: 14px;
    border-radius: 2px; pointer-events: none; z-index: 999;
    animation: confettiFall 1.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  .msg { min-height: 24px; color: #fca5a5; font-size: 0.95rem; font-weight: 800; margin-bottom: 8px; text-align: center; }
  .keyboard { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .kb-row { display: flex; justify-content: center; gap: 6px; }
  .key {
    flex: 1; height: 48px; max-width: 40px;
    background: linear-gradient(180deg, #64748b 0%, #475569 100%);
    color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
    box-shadow: 0 4px 0 #1e293b, 0 5px 10px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
    font-weight: 800; font-size: 1.05rem; cursor: pointer;
  }
  .key:active { transform: translateY(3px); box-shadow: 0 1px 0 #1e293b; }
  .key.wide { max-width: 66px; font-size: 0.82rem; }
  .key.green { background: linear-gradient(180deg, #22c55e 0%, #15803d 100%); border-color: #4ade80; box-shadow: 0 4px 0 #14532d; }
  .key.yellow { background: linear-gradient(180deg, #eab308 0%, #b45309 100%); border-color: #fde047; box-shadow: 0 4px 0 #78350f; }
  .key.grey { background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); color: #64748b; box-shadow: 0 3px 0 #090d16; }

  .legend {
    max-width: 440px; width: 100%; font-size: 0.95rem; color: #f4f4f5;
    background: linear-gradient(180deg, rgba(45, 58, 79, 0.92) 0%, rgba(30, 41, 59, 0.95) 100%);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 6px 0 #0f172a, 0 10px 20px rgba(0,0,0,0.35);
    padding: 12px 16px; border-radius: 10px; line-height: 1.6;
  }
  .bonus-pill {
    display: inline-block; margin-top: 6px; padding: 4px 10px;
    background: rgba(250, 204, 21, 0.16); border: 1px solid var(--gold);
    color: var(--gold); border-radius: 6px; font-weight: 800; font-size: 0.92rem;
  }

  .modal {
    display: none; flex-direction: column; align-items: center;
    background: linear-gradient(180deg, rgba(45, 58, 79, 0.96) 0%, rgba(30, 41, 59, 0.98) 100%);
    border: 2px solid var(--gold); padding: 18px; border-radius: 12px;
    box-shadow: 0 8px 0 #0f172a, 0 14px 28px rgba(0,0,0,0.5);
    width: 100%; max-width: 440px; text-align: center; margin-bottom: 14px;
  }
  .modal.active { display: flex; }
  .modal-btns { display: flex; gap: 10px; margin-top: 12px; }
  .share-btn { background: linear-gradient(180deg, #22c55e 0%, #15803d 100%) !important; border-color: #4ade80 !important; color:#fff; }
  .next-btn { background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%) !important; border-color: #7dd3fc !important; color:#fff; }

  body {
    background: radial-gradient(circle at 50% 16%, #f4a27e 0%, #c2644f 45%, #4a211f 100%) !important;
    background-attachment: fixed !important;
  }
  .nav-tabs {
    background: rgba(45, 18, 17, 0.72) !important;
    border-color: rgba(255, 220, 200, 0.22) !important;
  }
  .nav-tabs a.active {
    background: linear-gradient(180deg, #fb923c 0%, #ea580c 100%) !important;
    box-shadow: 0 3px 0 #9a3412, 0 4px 10px rgba(0,0,0,0.35) !important;
  }
  .stat-card, .clues-box, .legend, .modal {
    background: linear-gradient(180deg, rgba(82, 38, 35, 0.92) 0%, rgba(54, 24, 22, 0.96) 100%) !important;
    border: 1px solid rgba(255, 215, 195, 0.22) !important;
    box-shadow: 0 6px 0 #29100e, 0 10px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.22) !important;
  }
  .clue-row {
    background: rgba(36, 14, 13, 0.65) !important;
    border-color: rgba(255, 210, 190, 0.12) !important;
  }
  .clue-badge {
    background: #5c2824 !important;
    color: #fdba74 !important;
    border-color: rgba(251, 146, 60, 0.4) !important;
  }
  .cell {
    background: linear-gradient(180deg, #4a211f 0%, #2e1210 100%) !important;
    border-color: rgba(255, 215, 195, 0.25) !important;
    box-shadow: 0 6px 0 #1c0908, 0 8px 14px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.22) !important;
  }
  .cell.active-input {
    border: 2px solid #fdba74 !important;
    background: linear-gradient(180deg, #632c29 0%, #3d1917 100%) !important;
  }
  .key {
    background: linear-gradient(180deg, #7c433e 0%, #572c28 100%) !important;
    border-color: rgba(255, 220, 200, 0.25) !important;
    box-shadow: 0 4px 0 #2e1210, 0 5px 10px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.3) !important;
  }
  .key.grey {
    background: linear-gradient(180deg, #361715 0%, #210c0b 100%) !important;
    color: #9a6b66 !important;
    box-shadow: 0 3px 0 #140605 !important;
  }
  select, button {
    background: linear-gradient(180deg, #632c29 0%, #421b19 100%) !important;
    border-color: rgba(255, 220, 200, 0.25) !important;
    box-shadow: 0 4px 0 #240c0b !important;
  }

</style>

<body>

<nav class="nav-tabs">
  <a href="index.html">1. SWAP / CROSS</a>
  <a href="bridge.html" class="active">2. BRIDGE</a>
  <a href="vault.html">3. THE VAULT</a>
</nav>

<header>
  <div class="title-wrap">
    <h1>BRIDGE</h1>
    <div class="bank-score" id="totalScoreDisplay">🏆 Total Score: 0 pts</div>
  </div>
  <div>
    <button id="installAppBtn" onclick="triggerInstall()" style="display:none; margin-right:6px; background:linear-gradient(180deg,#22c55e,#15803d)!important; border-color:#4ade80!important;">📲 Install App</button><select id="puzzleSelect"></select>
  </div>
</header>

<div class="scoreboard">
  <div class="stat-card turn-green" id="turnCard">
    <div class="stat-label">GUESSES</div>
    <div class="stat-val" id="guessesVal">0/5</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">🔗 CLUES OPEN</div>
    <div class="stat-val" id="cluesOpenVal" style="color:var(--accent);">1/3</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">SCORE</div>
    <div class="stat-val pts-high" id="scoreVal">100</div>
  </div>
</div>

<div class="clues-box" id="cluesBox"></div>
<div class="msg" id="msgBox"></div>
<div class="grid" id="grid"></div>

<div class="modal" id="winModal">
  <h2 id="modalTitle" style="margin:0 0 6px 0;"></h2>
  <p id="modalSub" style="margin:0 0 6px 0; font-size:1rem; color:#ffffff; font-weight:700;"></p>
  <p id="modalPhrases" style="margin:0; font-size:0.9rem; color:#cbd5e1;"></p>
  <div class="modal-btns">
    <button class="share-btn" onclick="shareResult()">Share Score</button>
    <button class="next-btn" onclick="goNextBridge()">Next Bridge ➔</button>
  </div>
</div>

<div class="keyboard" id="keyboard"></div>

<div class="legend">
  <strong>ONE SHOT PER BOARD:</strong> 2nd Try = <strong>100 pts</strong> &bull; 3rd Try = <strong>80 pts</strong> &bull; 4th = <strong>60 pts</strong> &bull; 5th = <strong>40 pts</strong>.<br>
  <span class="bonus-pill">⚡ HOLE-IN-ONE BONUS: Crack on Guess #1 for 120 PTS!</span>
</div>

<script>
const PUZZLES = [
  { id: 1, answer: "SIGHT", clues: ["SHORT  [ _ _ _ _ _ ]", "[ _ _ _ _ _ ]  READING", "OUT OF  [ _ _ _ _ _ ]"] },
  { id: 2, answer: "CHECK", clues: ["BLIND  [ _ _ _ _ _ ]", "[ _ _ _ _ _ ]  MATE", "RAIN  [ _ _ _ _ _ ]"] },
  { id: 3, answer: "BOARD", clues: ["ABOVE  [ _ _ _ _ _ ]", "[ _ _ _ _ _ ]  GAME", "CUTTING  [ _ _ _ _ _ ]"] },
  { id: 4, answer: "LIGHT", clues: ["GREEN  [ _ _ _ _ _ ]", "[ _ _ _ _ _ ]  WEIGHT", "TRAVEL  [ _ _ _ _ _ ]"] },
  { id: 5, answer: "POINT", clues: ["BLIND  [ _ _ _ _ _ ]", "[ _ _ _ _ _ ]  BLANK", "BOILING  [ _ _ _ _ _ ]"] },
  { id: 6, answer: "TRACK", clues: ["SOUND  [ _ _ _ _ _ ]", "[ _ _ _ _ _ ]  RECORD", "LAUGH  [ _ _ _ _ _ ]"] },
  { id: 7, answer: "COURT", clues: ["FOOD  [ _ _ _ _ _ ]", "[ _ _ _ _ _ ]  MARTIAL", "TENNIS  [ _ _ _ _ _ ]"] },
  { id: 8, answer: "HEART", clues: ["BY  [ _ _ _ _ _ ]", "[ _ _ _ _ _ ]  BEAT", "CHANGE OF  [ _ _ _ _ _ ]"] },
  { id: 9, answer: "HOUSE", clues: ["FULL  [ _ _ _ _ _ ]", "[ _ _ _ _ _ ]  ARREST", "ON THE  [ _ _ _ _ _ ]"] },
  { id: 10, answer: "TABLE", clues: ["WATER  [ _ _ _ _ _ ]", "[ _ _ _ _ _ ]  TENNIS", "UNDER THE  [ _ _ _ _ _ ]"] },
  { id: 11, answer: "NIGHT", clues: ["LATE  [ _ _ _ _ _ ]", "[ _ _ _ _ _ ]  SHIFT", "OVER  [ _ _ _ _ _ ]"] },
  { id: 12, answer: "WATER", clues: ["STILL  [ _ _ _ _ _ ]", "[ _ _ _ _ _ ]  TIGHT", "HOT  [ _ _ _ _ _ ]"] },
  { id: 13, answer: "PAPER", clues: ["DAILY  [ _ _ _ _ _ ]", "[ _ _ _ _ _ ]  TRAIL", "WALL  [ _ _ _ _ _ ]"] },
  { id: 14, answer: "GLASS", clues: ["HOUR  [ _ _ _ _ _ ]", "[ _ _ _ _ _ ]  CEILING", "STAINED  [ _ _ _ _ _ ]"] },
  { id: 15, answer: "STONE", clues: ["STEPPING  [ _ _ _ _ _ ]", "[ _ _ _ _ _ ]  COLD", "BLARNEY  [ _ _ _ _ _ ]"] }
];

let currentPuzzle = PUZZLES[0], guesses = [], currentGuess = ["","","","",""];
let lockedGreens = [null,null,null,null,null], requiredYellows = new Set(), gameOver = false, wonGame = false;
let lastRowAnim = null;
const selectEl = document.getElementById("puzzleSelect");
const STATE_KEY = "bridge_oneshot_state_v1";

function getAllState() {
  try { return JSON.parse(localStorage.getItem(STATE_KEY)) || {}; }
  catch (e) { return {}; }
}

function saveBridgeState() {
  const all = getAllState();
  all[currentPuzzle.id] = {
    guesses, lockedGreens, requiredYellows: Array.from(requiredYellows),
    gameOver, wonGame, pts: calcBridgePoints(guesses.length, wonGame, gameOver)
  };
  localStorage.setItem(STATE_KEY, JSON.stringify(all));
}

function calcBridgePoints(numGuesses, won, over) {
  if (over && !won) return 0;
  if (!over) {
    // Live potential points for the upcoming guess
    const nextTry = numGuesses + 1;
    if (nextTry === 1) return 120;
    if (nextTry === 2) return 100;
    if (nextTry === 3) return 80;
    if (nextTry === 4) return 60;
    return 40;
  }
  if (numGuesses === 1) return 120;
  if (numGuesses === 2) return 100;
  if (numGuesses === 3) return 80;
  if (numGuesses === 4) return 60;
  return 40;
}

function launchConfetti() {
  const colors = ['#facc15', '#22c55e', '#38bdf8', '#f472b6', '#ffffff'];
  for (let i = 0; i < 55; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (1.2 + Math.random() * 1.1) + 's';
    el.style.animationDelay = (Math.random() * 0.25) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }
}

function updateHeaderBank() {
  const all = getAllState();
  const done = Object.values(all).filter(s => s.gameOver);
  const total = done.reduce((acc, s) => acc + s.pts, 0);
  document.getElementById("totalScoreDisplay").textContent = `🏆 Total Score: ${total} pts (${done.length}/${PUZZLES.length} played)`;
}

function initDropdown() {
  selectEl.innerHTML = "";
  const all = getAllState();
  PUZZLES.forEach((p, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    const s = all[p.id];
    const tag = s && s.gameOver ? (s.wonGame ? ` (🔗 ${s.pts} pts)` : " (🔒 0 pts)") : (s && s.guesses.length > 0 ? ` (${s.guesses.length}/5)` : "");
    opt.textContent = `Bridge #${p.id}${tag}`;
    selectEl.appendChild(opt);
  });
  selectEl.onchange = e => loadPuzzle(parseInt(e.target.value));
}

function loadPuzzle(idx) {
  currentPuzzle = PUZZLES[idx];
  const saved = getAllState()[currentPuzzle.id];
  lastRowAnim = null;
  if (saved) {
    guesses = saved.guesses || [];
    lockedGreens = saved.lockedGreens || [null,null,null,null,null];
    requiredYellows = new Set(saved.requiredYellows || []);
    gameOver = saved.gameOver || false;
    wonGame = saved.wonGame || false;
  } else {
    guesses = [];
    lockedGreens = [null,null,null,null,null];
    requiredYellows = new Set();
    gameOver = false;
    wonGame = false;
  }
  initNextInputRow();
  setMsg("");
  updateHeaderBank();
  render();
}

function goNextBridge() {
  const nextIdx = (parseInt(selectEl.value) + 1) % PUZZLES.length;
  selectEl.value = nextIdx;
  loadPuzzle(nextIdx);
}

function setMsg(txt) { document.getElementById("msgBox").textContent = txt; }
function initNextInputRow() { currentGuess = lockedGreens.map(ch => ch ? ch : ""); }

function evaluateGuess(word, ans) {
  const res = ["grey","grey","grey","grey","grey"], ansCount = {};
  for (let i = 0; i < 5; i++) {
    if (word[i] === ans[i]) res[i] = "green";
    else ansCount[ans[i]] = (ansCount[ans[i]] || 0) + 1;
  }
  for (let i = 0; i < 5; i++) {
    if (res[i] !== "green" && ansCount[word[i]] > 0) {
      res[i] = "yellow"; ansCount[word[i]]--;
    }
  }
  return res;
}

function onKey(k) {
  if (gameOver) return;
  setMsg("");
  if (k === "BACK") {
    for (let i = 4; i >= 0; i--) {
      if (lockedGreens[i] === null && currentGuess[i] !== "") { currentGuess[i] = ""; break; }
    }
  } else if (k === "ENTER") { submitGuess(); return; }
  else if (/^[A-Z]$/.test(k)) {
    for (let i = 0; i < 5; i++) {
      if (currentGuess[i] === "") { currentGuess[i] = k; break; }
    }
  }
  render();
}

function submitGuess() {
  const word = currentGuess.join("");
  if (word.length < 5 || currentGuess.includes("")) { setMsg("Fill all 5 letters first."); return; }
  for (let y of requiredYellows) {
    if (!word.includes(y)) { setMsg(`Strict Lock: Must use discovered letter '${y}'!`); return; }
  }
  const colors = evaluateGuess(word, currentPuzzle.answer);
  guesses.push({ word, colors });
  colors.forEach((c, i) => {
    if (c === "green") lockedGreens[i] = word[i];
    if (c === "yellow") requiredYellows.add(word[i]);
  });

  if (word === currentPuzzle.answer) {
    gameOver = true;
    wonGame = true;
    lastRowAnim = "win";
    launchConfetti();
  } else if (guesses.length >= 5) {
    gameOver = true;
    wonGame = false;
    lastRowAnim = "shake";
  } else {
    lastRowAnim = "shake";
    initNextInputRow();
  }

  saveBridgeState();
  const curIdx = parseInt(selectEl.value);
  initDropdown(); selectEl.value = curIdx;
  updateHeaderBank();
  render();
}

function render() {
  const unlockedCount = gameOver ? 3 : (guesses.length === 0 ? 1 : (guesses.length < 3 ? 2 : 3));
  document.getElementById("guessesVal").textContent = `${guesses.length}/5`;
  document.getElementById("cluesOpenVal").textContent = `${unlockedCount}/3`;

  const turnCard = document.getElementById("turnCard");
  if (guesses.length <= 2) turnCard.className = "stat-card turn-green";
  else if (guesses.length <= 4) turnCard.className = "stat-card turn-orange";
  else turnCard.className = "stat-card turn-red";

  const pts = calcBridgePoints(guesses.length, wonGame, gameOver);
  const scoreEl = document.getElementById("scoreVal");
  scoreEl.textContent = pts;
  scoreEl.className = "stat-val " + (pts >= 100 ? "pts-high" : pts >= 60 ? "pts-mid" : "pts-low");

  const cluesEl = document.getElementById("cluesBox"); cluesEl.innerHTML = "";
  currentPuzzle.clues.forEach((c, idx) => {
    const row = document.createElement("div");
    if (idx < unlockedCount) {
      row.className = "clue-row";
      const pattern = gameOver && wonGame ? currentPuzzle.answer.split("").join(" ") : lockedGreens.map(g => g ? g : "_").join(" ");
      row.innerHTML = `<span>${c.replace("_ _ _ _ _", pattern)}</span><span class="clue-badge">Clue #${idx+1}</span>`;
    } else {
      row.className = "clue-row locked";
      row.innerHTML = `<span>🔒 Unlocks after Guess #${idx === 1 ? 1 : 3}</span><span class="clue-badge">Locked</span>`;
    }
    cluesEl.appendChild(row);
  });

  const gridEl = document.getElementById("grid"); gridEl.innerHTML = "";
  for (let r = 0; r < 5; r++) {
    const rowDiv = document.createElement("div");
    let rCls = "row";
    if (r === guesses.length - 1 && lastRowAnim === "win") rCls += " win-row";
    else if (r === guesses.length - 1 && lastRowAnim === "shake") rCls += " shake-row";
    rowDiv.className = rCls;

    for (let c = 0; c < 5; c++) {
      const cell = document.createElement("div");
      if (r < guesses.length) {
        cell.className = `cell ${guesses[r].colors[c]}`; cell.textContent = guesses[r].word[c];
      } else if (r === guesses.length && !gameOver) {
        cell.className = "cell active-input" + (lockedGreens[c] !== null ? " locked-hint" : "");
        cell.textContent = currentGuess[c];
      } else cell.className = "cell";
      rowDiv.appendChild(cell);
    }
    gridEl.appendChild(rowDiv);
  }

  const m = document.getElementById("winModal");
  if (gameOver) {
    m.classList.add("active");
    const earlyBadge = (wonGame && guesses.length <= 3) ? " ⚡ (Before Clue #3!)" : "";
    document.getElementById("modalTitle").textContent = wonGame ? `🔗 ${pts} POINTS LOCKED!` : `🔒 LOCKED OUT (0 PTS — ${currentPuzzle.answer})`;
    document.getElementById("modalSub").textContent = wonGame ? `Cracked in ${guesses.length}/5 Guesses${earlyBadge}` : `Out of guesses!`;
    document.getElementById("modalPhrases").textContent = currentPuzzle.clues.map(c => c.replace("[ _ _ _ _ _ ]", currentPuzzle.answer)).join(" • ");
  } else {
    m.classList.remove("active");
  }

  const kbEl = document.getElementById("keyboard"); kbEl.innerHTML = "";
  const keyColors = {};
  guesses.forEach(g => {
    for (let i = 0; i < 5; i++) {
      const ch = g.word[i], col = g.colors[i];
      if (col === "green") keyColors[ch] = "green";
      else if (col === "yellow" && keyColors[ch] !== "green") keyColors[ch] = "yellow";
      else if (col === "grey" && !keyColors[ch]) keyColors[ch] = "grey";
    }
  });
  [
    ["Q","W","E","R","T","Y","U","I","O","P"],
    ["A","S","D","F","G","H","J","K","L"],
    ["ENTER","Z","X","C","V","B","N","M","BACK"]
  ].forEach(r => {
    const rDiv = document.createElement("div"); rDiv.className = "kb-row";
    r.forEach(k => {
      const btn = document.createElement("button");
      btn.className = "key" + (k.length > 1 ? " wide" : "") + (keyColors[k] ? ` ${keyColors[k]}` : "");
      btn.textContent = k === "BACK" ? "⌫" : k;
      btn.onclick = () => onKey(k);
      rDiv.appendChild(btn);
    });
    kbEl.appendChild(rDiv);
  });
}

window.addEventListener("keydown", e => {
  if (e.key === "Backspace") onKey("BACK");
  else if (e.key === "Enter") onKey("ENTER");
  else if (/^[a-zA-Z]$/.test(e.key)) onKey(e.key.toUpperCase());
});

function shareResult() {
  const map = { green: "🟩", yellow: "🟨", grey: "⬛" };
  const pts = calcBridgePoints(guesses.length, wonGame, gameOver);
  const lines = guesses.map(g => "🔗 " + g.colors.map(c => map[c]).join(""));
  const text = `BRIDGE #${currentPuzzle.id} — ${pts} PTS (${guesses.length}/5)\n` + lines.join("\n");
  navigator.clipboard.writeText(text);
  alert("Copied to clipboard!\n\n" + text);
}

initDropdown();
loadPuzzle(0);
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('installAppBtn');
  if (btn) btn.style.display = 'inline-block';
});
function triggerInstall() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      const btn = document.getElementById('installAppBtn');
      if (btn) btn.style.display = 'none';
    });
  }
}
</script>
